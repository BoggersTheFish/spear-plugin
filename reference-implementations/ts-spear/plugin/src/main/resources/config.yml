schema-version: 1
locale: en_US

engine:
  worker-threads: 2
  evidence-dedupe-window-ms: 500

storage:
  backend: SQLITE
  batch-size: 100
  flush-interval-ms: 50
  evidence-persist-threshold: 0.25
  mysql:
    host: localhost
    port: 3306
    database: tsspear
    username: root
    password: ""
  postgres:
    host: localhost
    port: 5432
    database: tsspear
    username: postgres
    password: ""

checks:
  movement:
    max-acceleration: 0.52
    max-speed: 0.65
    max-air-ticks: 40
  combat:
    max-reach: 3.2
    killaura-window-ticks: 10
    killaura-victim-threshold: 3
    max-knockback-damage-ratio: 0.5
  networking:
    blink-min-interval-ms: 40
    bad-packet-position-threshold: 0.5

performance:
  object-pooling-enabled: true
  graph-node-pool-size: 512
  evidence-builder-pool-size: 256
  movement-scratch-pool-size: 128
  graph-propagation-batch-size: 16

networking:
  lag-threshold-ms: 200

graph:
  contradiction-multiplier: 0.85
  tension-sensitivity: 1.2
  confidence-epsilon: 0.005

thresholds:
  watch: 0.35
  alert: 0.65
  elevate: 0.80

replay:
  ring-buffer-seconds: 30
  ticks-per-second: 20
  continuous-capture-seconds: 300

ml:
  export-window-seconds: 300
  inference-provider: rule-based
  rule-based:
    cheating-threshold: 0.65
    suspicious-threshold: 0.40

decay:
  movement:
    curve: EXPONENTIAL
    rate: 0.02
  combat:
    curve: LINEAR
    rate: 0.01
  inventory:
    curve: LINEAR
    rate: 0.01
  automation:
    curve: EXPONENTIAL
    rate: 0.015
  networking:
    curve: LINEAR
    rate: 0.02
  interaction:
    curve: LINEAR
    rate: 0.01